syntax = "proto3";

package cms.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Velopulent CMS content API.
//
// Authenticate every call with `authorization: Bearer <token>` using a scoped
// `vcms_site_*` site key or `vcms_pat_*` personal token. Every site-scoped
// request names its site in `site_id`; a site key only accepts its own site.
//
// Dynamic content travels as google.protobuf.Struct. Struct numbers are
// doubles, so integers beyond 2^53 lose precision.
//
// List RPCs page with `page_size` (default 50, maximum 200) and the opaque
// `page_token` returned as `next_page_token`. A token is bound to the query
// that produced it.

service SiteService {
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc GetSite(GetSiteRequest) returns (Site);
}

service CollectionService {
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetCollection(GetCollectionRequest) returns (Collection);
}

service EntryService {
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc GetEntry(GetEntryRequest) returns (Entry);
  rpc CreateEntry(CreateEntryRequest) returns (Entry);
  rpc UpdateEntry(UpdateEntryRequest) returns (Entry);
  rpc DeleteEntry(DeleteEntryRequest) returns (DeleteResponse);
  rpc PublishEntry(PublishEntryRequest) returns (Entry);
  rpc UnpublishEntry(UnpublishEntryRequest) returns (Entry);
  rpc ListEntryRevisions(ListEntryRevisionsRequest) returns (ListEntryRevisionsResponse);
  rpc GetEntryRevision(GetEntryRevisionRequest) returns (EntryRevision);
  rpc RestoreEntryRevision(RestoreEntryRevisionRequest) returns (Entry);
}

service SingletonService {
  rpc ListSingletons(ListSingletonsRequest) returns (ListSingletonsResponse);
  rpc GetSingleton(GetSingletonRequest) returns (Singleton);
  rpc UpdateSingleton(UpdateSingletonRequest) returns (Singleton);
}

service FileService {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc GetFile(GetFileRequest) returns (File);
  rpc ListFileReferences(ListFileReferencesRequest) returns (ListFileReferencesResponse);
  // The first message carries site_id, filename and content_type; later
  // messages carry only chunks.
  rpc UploadFile(stream UploadFileRequest) returns (File);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteResponse);
  rpc RestoreFile(RestoreFileRequest) returns (File);
}

message DeleteResponse {
  bool deleted = 1;
}

// Sites

message Site {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ListSitesRequest {}

message ListSitesResponse {
  repeated Site sites = 1;
}

message GetSiteRequest {
  string site_id = 1;
}

// Collections

message Collection {
  string id = 1;
  string site_id = 2;
  string name = 3;
  string slug = 4;
  google.protobuf.Struct definition = 5;
  bool is_singleton = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListCollectionsRequest {
  string site_id = 1;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
}

message GetCollectionRequest {
  string site_id = 1;
  string slug = 2;
}

// Entries

message Entry {
  string id = 1;
  string site_id = 2;
  string collection_id = 3;
  google.protobuf.Struct data = 4;
  string slug = 5;
  // "draft" or "published".
  string status = 6;
  optional string singleton_collection_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Unset while the entry is a draft.
  google.protobuf.Timestamp published_at = 10;
  // Opaque optimistic-concurrency version; send it back as expected_version.
  string version = 11;
}

message ListEntriesRequest {
  string site_id = 1;
  optional string collection_id = 2;
  optional string status = 3;
  optional string search = 4;
  // Include drafts; requires content.preview.read.
  bool include_drafts = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListEntriesResponse {
  repeated Entry items = 1;
  string next_page_token = 2;
  int64 total_size = 3;
}

message GetEntryRequest {
  string site_id = 1;
  string id = 2;
  bool include_drafts = 3;
}

message CreateEntryRequest {
  string site_id = 1;
  string collection_id = 2;
  string slug = 3;
  google.protobuf.Struct data = 4;
}

message UpdateEntryRequest {
  string site_id = 1;
  string id = 2;
  // Unset keeps the current data.
  google.protobuf.Struct data = 3;
  optional string slug = 4;
  // Changing status requires content.publish.
  optional string status = 5;
  optional string change_summary = 6;
  // When set, the update fails with FAILED_PRECONDITION unless it matches.
  string expected_version = 7;
}

message DeleteEntryRequest {
  string site_id = 1;
  string id = 2;
}

message PublishEntryRequest {
  string site_id = 1;
  string id = 2;
}

message UnpublishEntryRequest {
  string site_id = 1;
  string id = 2;
}

message EntryRevision {
  string id = 1;
  string entry_id = 2;
  int64 revision_number = 3;
  google.protobuf.Struct data = 4;
  optional string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  optional string change_summary = 7;
}

message ListEntryRevisionsRequest {
  string site_id = 1;
  string entry_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListEntryRevisionsResponse {
  repeated EntryRevision items = 1;
  string next_page_token = 2;
  int64 total_size = 3;
}

message GetEntryRevisionRequest {
  string site_id = 1;
  string entry_id = 2;
  int64 revision_number = 3;
}

message RestoreEntryRevisionRequest {
  string site_id = 1;
  string entry_id = 2;
  int64 revision_number = 3;
}

// Singletons

message Singleton {
  string id = 1;
  string site_id = 2;
  string name = 3;
  string slug = 4;
  google.protobuf.Struct definition = 5;
  // Unset until the singleton has content.
  google.protobuf.Struct data = 6;
  optional string entry_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string version = 10;
}

message ListSingletonsRequest {
  string site_id = 1;
  bool include_drafts = 2;
}

message ListSingletonsResponse {
  repeated Singleton singletons = 1;
}

message GetSingletonRequest {
  string site_id = 1;
  string slug = 2;
  bool include_drafts = 3;
}

message UpdateSingletonRequest {
  string site_id = 1;
  string slug = 2;
  google.protobuf.Struct data = 3;
  optional string change_summary = 4;
  string expected_version = 5;
}

// Files

message File {
  string id = 1;
  string site_id = 2;
  string filename = 3;
  string original_name = 4;
  string mime_type = 5;
  int64 size = 6;
  // Delivery URL; relative URLs resolve against the server origin.
  string url = 7;
  optional string thumbnail_url = 8;
  optional int32 width = 9;
  optional int32 height = 10;
  // Set while the file is in the trash.
  google.protobuf.Timestamp deleted_at = 11;
  optional string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
}

message ListFilesRequest {
  string site_id = 1;
  optional string search = 2;
  // MIME type prefix such as "image".
  optional string file_type = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListFilesResponse {
  repeated File files = 1;
  string next_page_token = 2;
  int64 total_size = 3;
}

message GetFileRequest {
  string site_id = 1;
  string id = 2;
}

message FileReference {
  string entry_id = 1;
  string collection_name = 2;
  string field_name = 3;
}

message ListFileReferencesRequest {
  string site_id = 1;
  string id = 2;
}

message ListFileReferencesResponse {
  repeated FileReference references = 1;
}

message UploadFileRequest {
  string site_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes chunk = 4;
}

message DeleteFileRequest {
  string site_id = 1;
  string id = 2;
}

message RestoreFileRequest {
  string site_id = 1;
  string id = 2;
}

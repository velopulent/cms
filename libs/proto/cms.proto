syntax = "proto3";

package cms.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Collection Service - Site-scoped operations (requires scoped vcms_site_* or vcms_pat_* token)
service CollectionService {
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetCollection(GetCollectionRequest) returns (Collection);
}

// Entry Service - Site-scoped operations (requires scoped vcms_site_* or vcms_pat_* token)
service EntryService {
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc GetEntry(GetEntryRequest) returns (Entry);
  rpc CreateEntry(CreateEntryRequest) returns (Entry);
  rpc UpdateEntry(UpdateEntryRequest) returns (Entry);
  rpc DeleteEntry(DeleteEntryRequest) returns (DeleteResponse);
  rpc PublishEntry(PublishEntryRequest) returns (Entry);
  rpc UnpublishEntry(UnpublishEntryRequest) returns (Entry);
  rpc ListEntryRevisions(ListEntryRevisionsRequest) returns (ListEntryRevisionsResponse);
  rpc GetEntryRevision(GetEntryRevisionRequest) returns (EntryRevision);
  rpc RestoreEntryRevision(RestoreEntryRevisionRequest) returns (Entry);
}

// Singleton Service - Site-scoped operations (requires scoped vcms_site_* or vcms_pat_* token)
service SingletonService {
  rpc ListSingletons(ListSingletonsRequest) returns (ListSingletonsResponse);
  rpc GetSingleton(GetSingletonRequest) returns (Singleton);
  rpc UpdateSingleton(UpdateSingletonRequest) returns (Singleton);
}

// File Service - Site-scoped operations (requires scoped vcms_site_* or vcms_pat_* token)
service FileService {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc GetFile(GetFileRequest) returns (File);
  rpc ListFileReferences(GetFileReferencesRequest) returns (ListFileReferencesResponse);
  rpc UploadFile(stream UploadFileRequest) returns (File);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteResponse);
  rpc RestoreFile(RestoreFileRequest) returns (File);
}

// Site Service - Site-scoped operations (requires scoped vcms_site_* or vcms_pat_* token)
service SiteService {
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc GetSite(GetSiteRequest) returns (Site);
}

// Common Messages

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

// Collection Messages

message Collection {
  string id = 1;
  string site_id = 2;
  string name = 3;
  string slug = 4;
  // Deprecated JSON text; use definition_value.
  string definition = 5;
  bool is_singleton = 6;
  string created_at = 7;
  string updated_at = 8;
  google.protobuf.Struct definition_value = 9;
  google.protobuf.Timestamp created_at_timestamp = 10;
  google.protobuf.Timestamp updated_at_timestamp = 11;
}

message ListCollectionsRequest {
  string site_id = 1;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
}

message GetCollectionRequest {
  string slug = 1;
  string site_id = 2;
}

// Entry Messages

message Entry {
  string id = 1;
  string site_id = 2;
  string collection_id = 3;
  // Deprecated JSON text; use data_value.
  string data = 4;
  string slug = 5;
  string status = 6;
  optional string singleton_collection_id = 7;
  string created_at = 8;
  string updated_at = 9;
  optional string published_at = 10;
  google.protobuf.Struct data_value = 11;
  string version = 12;
  google.protobuf.Timestamp created_at_timestamp = 13;
  google.protobuf.Timestamp updated_at_timestamp = 14;
  google.protobuf.Timestamp published_at_timestamp = 15;
}

message ListEntriesRequest {
  optional string collection_id = 1;
  optional string status = 2;
  optional string search = 3;
  int64 page = 4;
  int64 per_page = 5;
  string site_id = 6;
  string page_token = 7;
  int32 page_size = 8;
  bool include_drafts = 9;
}

message ListEntriesResponse {
  repeated Entry items = 1;
  int64 total = 2;
  int64 page = 3;
  int64 per_page = 4;
  string next_page_token = 5;
  int64 total_size = 6;
}

message GetEntryRequest {
  string id = 1;
  string site_id = 2;
  bool include_drafts = 3;
}

message CreateEntryRequest {
  string collection_id = 1;
  // Deprecated JSON text; use data_value.
  string data = 2;
  string slug = 3;
  string site_id = 4;
  google.protobuf.Struct data_value = 5;
}

message UpdateEntryRequest {
  string id = 1;
  // Deprecated JSON text; use data_value.
  optional string data = 2;
  optional string slug = 3;
  optional string status = 4;
  optional string change_summary = 5;
  string site_id = 6;
  google.protobuf.Struct data_value = 7;
  string expected_version = 8;
}

message DeleteEntryRequest {
  string id = 1;
  string site_id = 2;
}

message PublishEntryRequest {
  string id = 1;
  string site_id = 2;
}

message UnpublishEntryRequest {
  string id = 1;
  string site_id = 2;
}

message EntryRevision {
  string id = 1;
  string entry_id = 2;
  int64 revision_number = 3;
  // Deprecated JSON text; use data_value.
  string data = 4;
  optional string created_by = 5;
  string created_at = 6;
  optional string change_summary = 7;
  google.protobuf.Struct data_value = 8;
  google.protobuf.Timestamp created_at_timestamp = 9;
}

message ListEntryRevisionsRequest {
  string entry_id = 1;
  int64 page = 2;
  int64 per_page = 3;
  string site_id = 4;
  bool include_drafts = 5;
}

message ListEntryRevisionsResponse {
  repeated EntryRevision items = 1;
  int64 total = 2;
  int64 page = 3;
  int64 per_page = 4;
  string next_page_token = 5;
  int64 total_size = 6;
}

message GetEntryRevisionRequest {
  string entry_id = 1;
  int64 revision_number = 2;
  string site_id = 3;
  bool include_drafts = 4;
}

message RestoreEntryRevisionRequest {
  string entry_id = 1;
  int64 revision_number = 2;
  string site_id = 3;
}

// Singleton Messages

message Singleton {
  string id = 1;
  string site_id = 2;
  string name = 3;
  string slug = 4;
  // Deprecated JSON text; use definition_value.
  string definition = 5;
  // Deprecated JSON text; use data_value.
  optional string data = 6;
  optional string entry_id = 7;
  string created_at = 8;
  string updated_at = 9;
  google.protobuf.Struct definition_value = 10;
  google.protobuf.Struct data_value = 11;
  google.protobuf.Timestamp created_at_timestamp = 12;
  google.protobuf.Timestamp updated_at_timestamp = 13;
  optional string version = 14;
}

message ListSingletonsRequest {
  string site_id = 1;
  bool include_drafts = 2;
}

message ListSingletonsResponse {
  repeated Singleton singletons = 1;
}

message GetSingletonRequest {
  string slug = 1;
  string site_id = 2;
  bool include_drafts = 3;
}

message UpdateSingletonRequest {
  string slug = 1;
  // Deprecated JSON text; use data_value.
  string data = 2;
  optional string change_summary = 3;
  string site_id = 4;
  google.protobuf.Struct data_value = 5;
  string expected_version = 6;
}

// File Messages

message File {
  string id = 1;
  string site_id = 2;
  string filename = 3;
  string original_name = 4;
  string mime_type = 5;
  int64 size = 6;
  string storage_provider = 7;
  string storage_key = 8;
  optional string thumbnail_key = 9;
  optional int32 width = 10;
  optional int32 height = 11;
  optional string deleted_at = 12;
  optional string created_by = 13;
  string created_at = 14;
  google.protobuf.Timestamp created_at_timestamp = 15;
}

message ListFilesRequest {
  optional string search = 1;
  optional string file_type = 2;
  int64 page = 3;
  int64 per_page = 4;
  string site_id = 5;
  string page_token = 6;
  int32 page_size = 7;
}

message ListFilesResponse {
  repeated File files = 1;
  int64 total = 2;
  int64 page = 3;
  int64 per_page = 4;
  string next_page_token = 5;
  int64 total_size = 6;
}

message GetFileRequest {
  string id = 1;
  string site_id = 2;
}

message FileReference {
  string entry_id = 1;
  string collection_name = 2;
  string field_name = 3;
}

message UploadFileRequest {
  string site_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes chunk = 4;
}

message GetFileReferencesRequest {
  string id = 1;
  string site_id = 2;
}

message ListFileReferencesResponse {
  repeated FileReference references = 1;
}

message DeleteFileRequest {
  string id = 1;
  string site_id = 2;
}

message RestoreFileRequest {
  string id = 1;
  string site_id = 2;
}

// Site Messages

message Site {
  string id = 1;
  string name = 2;
  string storage_provider = 3;
  string created_by = 4;
  string created_at = 5;
  string updated_at = 6;
  google.protobuf.Timestamp created_at_timestamp = 7;
  google.protobuf.Timestamp updated_at_timestamp = 8;
}

message SiteMember {
  string id = 1;
  string site_id = 2;
  string user_id = 3;
  string name = 4;
  string email = 5;
  string role = 6;
  string created_at = 7;
}

message GetSiteRequest {
  string site_id = 1;
}

message ListSitesRequest {}

message ListSitesResponse {
  repeated Site sites = 1;
}
